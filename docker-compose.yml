version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Trungnam@12345
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5001:8080"
    depends_on:
      - db

  student-service:
    build:
      context: .
      dockerfile: StudentService/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5002:8080"
      - "8081:8081" # gRPC
    depends_on:
      - db

  course-service:
    build:
      context: .
      dockerfile: CourseService/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Grpc__StudentService=http://student-service:8081
    ports:
      - "5003:8080"
    depends_on:
      - db
      - student-service

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5000:8080"
    depends_on:
      - identity-service
      - student-service
      - course-service

volumes:
  sqldata:
